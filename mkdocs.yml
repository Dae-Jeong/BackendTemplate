site_name: Backend Template 가이드
site_description: 로컬 실행부터 서비스 적용과 동시성·멱등성 검증까지
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:18090
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
      separator: '[\s\-·/()]+'
      pipeline: []
hooks:
  - docs/hooks.py
watch:
  - README.md
  - RUNBOOK.md
  - design
  - python/fastapi/README.md
  - ts/nestjs/README.md
  - java/spring-boot/README.md
  - ruby/rails/README.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - 사용 가이드:
      - 어디서 시작할까요: README.md
      - 템플릿 적용 Runbook: RUNBOOK.md
      - FastAPI 실행: design/implementations/quickstart.md
      - NestJS 실행: ts/nestjs/README.md
      - Spring Boot 실행: java/spring-boot/README.md
      - Rails 실행: ruby/rails/README.md
      - 로컬 모니터링: design/implementations/local-monitoring.md
      - FastAPI 서비스 적용: design/implementations/service-guide.md
  - 상세 설명:
      - 프로젝트 개요: design/overview.md
      - 구현별 현황: design/implementations/README.md
      - FastAPI:
          - 실행 환경과 명령: python/fastapi/README.md
          - 폴더와 역할: design/implementations/fastapi-structure.md
          - 구현 계약: design/implementations/fastapi.md
          - DI 선택 근거: design/implementations/fastapi-di-options.md
      - NestJS:
          - 구현 설계: design/implementations/nestjs.md
          - 폴더와 역할: design/implementations/nestjs-structure.md
      - Spring Boot:
          - 로직과 내부 동작: design/implementations/spring-boot-internals.md
          - 구현 설계: design/implementations/spring-boot.md
          - 폴더와 역할: design/implementations/spring-boot-structure.md
      - Rails:
          - 구현 설계: design/implementations/rails.md
          - 폴더와 역할: design/implementations/rails-structure.md
      - 공통 설계:
          - 개발 원칙: design/engineering.md
          - 로깅과 Metrics: design/observability.md
          - 문서 소유권: design/README.md
          - Backend: design/backend.md
          - Runtime과 성능: design/runtime-review.md
  - 작업·검증 기록:
      - Prisma·Rails 준비: design/implementations/prisma-rails-tasks.md
      - FastAPI:
          - 검증 결과와 재현: design/implementations/fastapi-verification.md
          - 완료 작업과 후속 범위: design/implementations/fastapi-tasks.md
      - NestJS:
          - 검증 결과와 재현: design/implementations/nestjs-verification.md
          - 단계별 작업: design/implementations/nestjs-tasks.md
      - Spring Boot:
          - 검증 결과와 재현: design/implementations/spring-boot-verification.md
          - 단계별 작업: design/implementations/spring-boot-tasks.md
      - Rails:
          - 검증 결과와 재현: design/implementations/rails-verification.md
          - 단계별 작업: design/implementations/rails-tasks.md
