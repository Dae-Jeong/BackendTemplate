# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= Integer(ENV.fetch("DB_POOL_SIZE", "5"), 10) %>
  timeout: <%= Integer(ENV.fetch("DB_BUSY_TIMEOUT_MILLISECONDS", "5000"), 10) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_PRIMARY_PATH", Rails.root.join("storage/development.sqlite3")) %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # An explicit URL prevents Rails from merging DATABASE_URL into the test config.
  # Tests also never inherit DB_PRIMARY_PATH, which belongs to native/production runs.
  url: <%= "sqlite3:#{Rails.root.join("storage/test.sqlite3")}" %>

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
production:
  <<: *default
  database: <%= ENV.fetch("DB_PRIMARY_PATH", Rails.root.join("storage/production.sqlite3")) %>
